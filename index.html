 const low=db.products.filter(p=>stock(p.id)<=Number(p.minStock??2));
 return `<div class="page-head"><div><h1>Dashboard de TRENDIA</h1><p>Indicadores del día a día y resumen mensual de perfumería.</p></div><div class="toolbar"><button class="btn primary" onclick="openSale()">＋ Registrar venta</button><button class="btn" onclick="saveDashboardSnapshot()">▣ Guardar dashboard</button></div></div>
 <div class="notice"><b>Guardado automático:</b> los cambios se guardan en este navegador. Para compartirlos con María Emilia en otro dispositivo hace falta conectar Firebase; hasta entonces, descarguen e intercambien respaldos.</div>
 <section class="panel" style="margin-bottom:16px"><div class="toolbar" style="align-items:end"><div class="field" style="margin:0;min-width:190px"><label for="dashboardMonth">Mes que quieres analizar</label><input id="dashboardMonth" type="month" value="${esc(month)}" onchange="setDashboardMonth(this.value)"></div><button class="btn" onclick="exportDashboardCSV()">⇩ Exportar indicadores del mes</button><button class="btn" onclick="printDashboard()">Imprimir / guardar PDF</button></div><p class="helper">Todos los indicadores, el gráfico y la tabla diaria corresponden al mes seleccionado.</p></section>
 <div class="cards">
 ${metricCard('Ventas netas',money(revenue),'Después de descuentos','↗')}${metricCard('Costo de venta',money(cost),'Costo de los lotes vendidos','▣')}${metricCard('Utilidad bruta',money(gross),'Ventas netas menos costo de venta','◈')}${metricCard('Gastos operativos',money(expenses),'Gastos con fecha en este mes','↘')}
 ${metricCard('Resultado estimado',money(net),'Utilidad bruta menos gastos operativos',net>=0?'✓':'!')}${metricCard('Descuentos otorgados',money(discounts),'Descuentos de todas las líneas','%')}${metricCard('Unidades vendidas',units,'Unidades de productos vendidos','▤')}${metricCard('Pedidos',monthSales.length,'Ventas registradas en el mes','🧾')}
 ${metricCard('Ticket promedio',money(avg),'Ventas netas ÷ pedidos','S/')}${metricCard('Margen bruto',margin.toLocaleString('es-PE',{maximumFractionDigits:1})+'%','Utilidad bruta ÷ ventas netas','%')}${metricCard('Valor actual de stock',money(db.products.reduce((a,p)=>a+lotsFor(p.id).reduce((b,l)=>b+stockLot(l)*Number(l.unitCost||0),0),0)),'Al costo puesto en Arequipa','📦')}${metricCard('Clientes registrados',db.customers.length,'Base total de clientes','♙')}
 </div>
 <div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Ventas por día</h3><p>Ingresos netos · ${esc(month)}</p></div><span class="pill">${daysInMonth} días</span></div><div class="bars">${daily.map(d=>`<div class="bar-col" title="${dateFmt(d.date)}: ${money(d.revenue)}"><div class="bar" style="height:${Math.max(2,d.revenue/max*135)}px"></div><small>${Number(d.date.slice(-2))}</small></div>`).join('')}</div><div class="legend"><span>Venta neta diaria</span><span style="margin-left:auto">Total: <b>${money(revenue)}</b></span></div></section>
 <section class="panel"><div class="panel-head"><div><h3>Productos más vendidos</h3><p>Por unidades durante el mes</p></div></div>${topProducts.length?topProducts.map(([n,v])=>`<div class="mini-stat"><span>${esc(n)}<small style="display:block">${money(v.revenue)} en ventas</small></span><b>${v.qty} unid.</b></div>`).join(''):'<div class="empty">Todavía no hay ventas en este mes.</div>'}</section></div>

 <section class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Detalle diario completo</h3><p>Un registro por cada día del mes, incluso si no hubo movimiento.</p></div><span class="pill">S/ · soles peruanos</span></div><div class="table-wrap"><table id="dailyDashboardTable"><thead><tr><th>Fecha</th><th>Pedidos</th><th>Unidades</th><th>Venta neta</th><th>Descuentos</th><th>Costo venta</th><th>Utilidad bruta</th><th>Gastos</th><th>Resultado neto</th></tr></thead><tbody>${daily.map(d=>`<tr><td>${dateFmt(d.date)}</td><td>${d.orders}</td><td>${d.units}</td><td>${money(d.revenue)}</td><td>${money(d.discount)}</td><td>${money(d.cost)}</td><td class="${d.gross>=0?'profit':'loss'}">${money(d.gross)}</td><td>${money(d.expenses)}</td><td class="${d.net>=0?'profit':'loss'}">${money(d.net)}</td></tr>`).join('')}</tbody><tfoot><tr><th>TOTAL MES</th><th>${monthSales.length}</th><th>${units}</th><th>${money(revenue)}</th><th>${money(discounts)}</th><th>${money(cost)}</th><th>${money(gross)}</th><th>${money(expenses)}</th><th>${money(net)}</th></tr></tfoot></table></div></section>

 <section class="panel" id="savedDashboards"><div class="panel-head"><div><h3>Dashboards guardados</h3><p>Capturas históricas de indicadores; no cambian al editar ventas futuras.</p></div></div>${db.dashboardSnapshots.length?`<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Mes analizado</th><th>Guardado</th><th>Ventas netas</th><th>Utilidad bruta</th><th>Resultado neto</th><th></th></tr></thead><tbody>${db.dashboardSnapshots.slice().sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||'')).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.month)}</td><td>${esc((x.savedAt||'').replace('T',' ').slice(0,16))}</td><td>${money(x.metrics?.revenue||0)}</td><td>${money(x.metrics?.gross||0)}</td><td>${money(x.metrics?.net||0)}</td><td><button class="btn small" onclick="viewDashboardSnapshot('${x.id}')">Ver</button> <button class="btn small danger" onclick="deleteDashboardSnapshot('${x.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no has guardado ningún dashboard. Selecciona un mes y pulsa “Guardar dashboard”.</div>'}</section>`;

function metricCard(title,value,caption,icon){return `<div class="metric"><div class="metric-top">${title}<span class="metric-icon">${icon}</span></div><strong>${value}</strong><small>${caption}</small></div>`}
function setDashboardMonth(v){if(!/^\d{4}-\d{2}$/.test(v))return;dashboardMonth=v;render()}
function dashboardReport(month=dashboardMonth){const [yy,mm]=month.split('-').map(Number),count=new Date(yy,mm,0).getDate(),sales=db.sales.filter(s=>(s.date||'').slice(0,7)===month),expenses=db.expenses.filter(e=>(e.date||'').slice(0,7)===month),items=sales.flatMap(s=>s.items||[]),revenue=sales.reduce((a,s)=>a+saleTotals(s).revenue,0),cost=sales.reduce((a,s)=>a+saleTotals(s).cost,0),discount=items.reduce((a,i)=>a+Number(i.discount||0),0),opex=expenses.reduce((a,e)=>a+Number(e.amount||0),0),units=items.reduce((a,i)=>a+Number(i.qty||0),0),daily=[];for(let i=1;i<=count;i++){const date=`${month}-${String(i).padStart(2,'0')}`,ss=sales.filter(s=>s.date===date),ii=ss.flatMap(s=>s.items||[]),r=ss.reduce((a,s)=>a+saleTotals(s).revenue,0),c=ss.reduce((a,s)=>a+saleTotals(s).cost,0),d=ii.reduce((a,x)=>a+Number(x.discount||0),0),e=expenses.filter(x=>x.date===date).reduce((a,x)=>a+Number(x.amount||0),0);daily.push({date,orders:ss.length,units:ii.reduce((a,x)=>a+Number(x.qty||0),0),revenue:r,discount:d,cost:c,gross:r-c,expenses:e,net:r-c-e})}return {month,metrics:{revenue,cost,gross:revenue-cost,expenses:opex,net:revenue-cost-opex,discount,units,orders:sales.length,averageTicket:sales.length?revenue/sales.length:0,margin:revenue?(revenue-cost)/revenue*100:0},daily}}
function saveDashboardSnapshot(){const report=dashboardReport(),name=prompt('Nombre para guardar este dashboard:',`Reporte ${report.month}`);if(name===null)return;if(!name.trim()){toast('Escribe un nombre para el dashboard.');return}db.dashboardSnapshots=db.dashboardSnapshots||[];db.dashboardSnapshots.push({id:uid('DASH'),name:name.trim(),month:report.month,savedAt:new Date().toISOString(),metrics:report.metrics,daily:report.daily});if(!persist())return;render();toast('Dashboard guardado como captura de ese mes.')}
function deleteDashboardSnapshot(id){if(!confirm('¿Eliminar esta captura guardada del dashboard?'))return;db.dashboardSnapshots=(db.dashboardSnapshots||[]).filter(x=>x.id!==id);persist();render();toast('Captura eliminada.')}
function viewDashboardSnapshot(id){const x=(db.dashboardSnapshots||[]).find(v=>v.id===id);if(!x)return;const d=x.daily||[];modal('Dashboard guardado · '+esc(x.name),`Mes ${esc(x.month)} · Captura histórica`, `<div class="cards">${metricCard('Ventas netas',money(x.metrics?.revenue||0),'Captura guardada','↗')}${metricCard('Utilidad bruta',money(x.metrics?.gross||0),'Captura guardada','◈')}${metricCard('Gastos operativos',money(x.metrics?.expenses||0),'Captura guardada','↘')}${metricCard('Resultado neto',money(x.metrics?.net||0),'Captura guardada','✓')}</div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Pedidos</th><th>Unidades</th><th>Ventas netas</th><th>Descuento</th><th>Costo venta</th><th>Utilidad bruta</th><th>Gastos</th><th>Resultado neto</th></tr></thead><tbody>${d.map(r=>`<tr><td>${dateFmt(r.date)}</td><td>${r.orders}</td><td>${r.units}</td><td>${money(r.revenue)}</td><td>${money(r.discount)}</td><td>${money(r.cost)}</td><td>${money(r.gross)}</td><td>${money(r.expenses)}</td><td>${money(r.net)}</td></tr>`).join('')}</tbody></table></div>`,'Cerrar');$('#recordForm').onsubmit=e=>{e.preventDefault();closeModal()};$('#recordForm .form-actions').innerHTML='<button type="button" class="btn primary" onclick="closeModal()">Cerrar</button>'}
function exportDashboardCSV(){const r=dashboardReport(),head=['Fecha','Pedidos','Unidades','Ventas netas','Descuentos','Costo de venta','Utilidad bruta','Gastos operativos','Resultado neto'];const rows=[head,...r.daily.map(d=>[d.date,d.orders,d.units,d.revenue,d.discount,d.cost,d.gross,d.expenses,d.net])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');downloadBlob(csv,`trendia_dashboard_${r.month}.csv`,'text/csv;charset=utf-8');toast('Indicadores diarios exportados.')}

function salesPage(){const rows=db.sales.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="page-head"><div><h1>Ventas</h1><p>Pedidos, descuentos, costo de venta y vendedor. Puedes editar o eliminar una venta y el stock se recalcula.</p></div><button class="btn primary" onclick="openSale()">＋ Registrar venta</button></div><div class="panel"><div class="toolbar"><input class="search" id="salesSearch" placeholder="Buscar cliente, pedido o perfume…" oninput="filterTable('salesSearch','salesTable')"><button class="btn" onclick="exportCSV('sales')">⇩ Exportar CSV</button></div><div class="table-wrap"><table id="salesTable"><thead><tr><th>Fecha / pedido</th><th>Cliente</th><th>Productos</th><th>Vendedor</th><th>Venta neta</th><th>Costo de venta</th><th>Descuento</th><th>Utilidad bruta</th><th>Pagado</th><th>Por cobrar</th><th>Acciones</th></tr></thead><tbody>${rows.map(s=>{const t=saleTotals(s),disc=(s.items||[]).reduce((a,i)=>a+Number(i.discount||0),0);return `<tr data-search="${esc((s.id+' '+(s.customerName||'')+' '+(s.phone||'')+' '+(s.items||[]).map(i=>i.name).join(' ')).toLowerCase())}"><td>${dateFmt(s.date)}<div class="sub">${esc(s.id)}</div></td><td>${esc(s.customerName||'Venta directa')}<div class="sub">${esc(s.phone||'')}</div></td><td>${(s.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td>${esc(s.seller||'—')}</td><td><b>${money(t.revenue)}</b></td><td>${money(t.cost)}</td><td>${money(disc)}</td><td class="${t.gross>=0?'profit':'loss'}">${money(t.gross)}</td><td>${money(s.amountPaid||0)}</td><td class="${Math.max(0,t.revenue-Number(s.amountPaid||0))>0?'loss':'profit'}">${money(Math.max(0,t.revenue-Number(s.amountPaid||0)))}</td><td><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn small" onclick="viewSale('${s.id}')">Ver</button><button class="btn small" onclick="openSale('${s.id}')">Editar</button><button class="btn small" onclick="saleNotePDF('${s.id}')">Nota PDF</button><button class="btn small function customersPage(){const debts=db.sales.filter(s=>saleTotals(s).revenue>Number(s.amountPaid||0));const debtTotal=debts.reduce((a,s)=>a+saleTotals(s).revenue-Number(s.amountPaid||0),0);return `<div class="page-head"><div><h1>Clientes</h1><p>Base de clientes, historial, deudas y cuentas por cobrar.</p></div><button class="btn primary" onclick="openCustomer()">＋ Nuevo cliente</button></div><div class="cards"><div class="metric"><div class="metric-top">Cuentas por cobrar</div><strong>${money(debtTotal)}</strong><small>${debts.length} venta(s) con saldo pendiente</small></div><div class="metric"><div class="metric-top">Clientes</div><strong>${db.customers.length}</strong><small>Registrados</small></div></div><div class="panel"><div class="panel-head"><div><h3>Deudores / pagos pendientes</h3><p>Registra abonos sin alterar el inventario.</p></div></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Pedido</th><th>Total</th><th>Pagado</th><th>Saldo</th><th>Vence</th><th>Acción</th></tr></thead><tbody>${debts.map(s=>`<tr><td>${dateFmt(s.date)}</td><td>${esc(s.customerName||'Venta directa')}<div class="sub">${esc(s.phone||'')}</div></td><td>${esc(s.id)}</td><td>${money(saleTotals(s).revenue)}</td><td>${money(s.amountPaid||0)}</td><td class="loss"><b>${money(saleTotals(s).revenue-Number(s.amountPaid||0))}</b></td><td>${dateFmt(s.dueDate)}</td><td><button class="btn small primary" onclick="addPayment('${s.id}')">Registrar abono</button></td></tr>`).join('')||'<tr><td colspan="8">No hay cuentas por cobrar.</td></tr>'}</tbody></table></div></div><div class="panel"><div class="toolbar"><input class="search" id="custSearch" placeholder="Buscar por nombre, apellido o teléfono…" oninput="filterTable('custSearch','customersTable')"><button class="btn" onclick="exportCSV('customers')">⇩ Exportar CSV</button></div><div class="table-wrap"><table id="customersTable"><thead><tr><th>Cliente</th><th>Teléfono</th><th>Fecha registro</th><th>Compras</th><th>Total comprado</th><th>Última compra</th><th>Acciones</th></tr></thead><tbody>${db.customers.map(c=>{const ss=db.sales.filter(s=>s.customerId===c.id),spent=ss.reduce((a,s)=>a+saleTotals(s).revenue,0),last=ss.map(s=>s.date).sort().pop();return `<tr data-search="${esc((c.name+' '+c.phone+' '+(c.district||'')).toLowerCase())}"><td><div class="product-name">${esc(c.name)}</div><div class="sub">${esc(c.district||'')} ${esc(c.notes||'')}</div></td><td>${esc(c.phone)}</td><td>${dateFmt(c.createdAt)}</td><td>${ss.length}</td><td><b>${money(spent)}</b></td><td>${dateFmt(last)}</td><td><button class="btn small" onclick="customerHistory('${c.id}')">Historial</button> <button class="btn small" onclick="openCustomer('${c.id}')">Editar</button> <button class="btn small danger" onclick="deleteRecord('customers','${c.id}')">Eliminar</button></td></tr>`}).join('')}</tbody></table>${!db.customers.length?'<div class="empty"><b>Tu base de clientes está vacía</b>Al registrar ventas con nombre y teléfono, los clientes se podrán guardar automáticamente.</div>':''}</div></div>`}
function expensesPage(){const sum=totalExpenses(),month=today().slice(0,7);return `<div class="page-head"><div><h1>Gastos operativos</h1><p>Movilidad, entregas, materiales de decants y otros gastos. Los registros se pueden editar.</p></div><button class="btn primary" onclick="openExpense()">＋ Registrar gasto</button></div><div class="cards"><div class="metric"><div class="metric-top">Gasto acumulado</div><strong>${money(sum)}</strong><small>Todos los registros</small></div><div class="metric"><div class="metric-top">Este mes</div><strong>${money(db.expenses.filter(e=>(e.date||'').slice(0,7)===month).reduce((a,e)=>a+Number(e.amount||0),0))}</strong><small>Gastos del mes actual</small></div><div class="metric"><div class="metric-top">Registros</div><strong>${db.expenses.length}</strong><small>Movimientos contabilizados</small></div><div class="metric"><div class="metric-top">Categorías</div><strong>${new Set(db.expenses.map(e=>e.category)).size}</strong><small>Categorías utilizadas</small></div></div><div class="panel"><div class="toolbar"><input class="search" id="expSearch" placeholder="Buscar gasto, proveedor o categoría…" oninput="filterTable('expSearch','expensesTable')"><button class="btn" onclick="exportCSV('expenses')">⇩ Exportar CSV</button></div><div class="table-wrap"><table id="expensesTable"><thead><tr><th>Fecha</th><th>Categoría</th><th>Detalle</th><th>Proveedor</th><th>Forma de pago</th><th>Monto</th><th>Acciones</th></tr></thead><tbody>${db.expenses.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<tr data-search="${esc((e.category+' '+e.detail+' '+(e.vendor||'')).toLowerCase())}"><td>${dateFmt(e.date)}</td><td><span class="pill">${esc(e.category)}</span></td><td>${esc(e.detail||'—')}</td><td>${esc(e.vendor||'—')}</td><td>${esc(e.payment||'—')}</td><td><b>${money(e.amount)}</b></td><td><button class="btn small" onclick="openExpense('${e.id}')">Editar</button> <button class="btn small danger" onclick="deleteRecord('expenses','${e.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table>${!db.expenses.length?'<div class="empty"><b>No hay gastos registrados</b>Agrega taxis, combis, frascos, decants, publicidad y otros.</div>':''}</div></div>`}
function purchasesPage(){let invested=db.lots.reduce((s,l)=>s+Number(l.qty||0)*Number(l.purchaseCost||0)+Number(l.freightTotal||0),0),oper=db.expenses.reduce((s,e)=>s+Number(e.amount||0),0);return `<div class="page-head"><div><h1>Compras e inversión</h1><p>Controla cuánto dinero entra a mercadería y cuánto se destina a operación.</p></div><button class="btn primary" onclick="openLot()">＋ Registrar compra</button></div><div class="cards"><div class="metric"><div class="metric-top">Inversión en mercadería <span class="metric-icon">📦</span></div><strong>${money(invested)}</strong><small>Compras registradas + fletes de entrada</small></div><div class="metric"><div class="metric-top">Inversión operativa <span class="metric-icon">🧴</span></div><strong>${money(oper)}</strong><small>Gastos y materiales registrados</small></div><div class="metric"><div class="metric-top">Lotes ingresados <span class="metric-icon">▤</span></div><strong>${db.lots.length}</strong><small>Compras por lote</small></div><div class="metric"><div class="metric-top">Costo de fletes <span class="metric-icon">🚚</span></div><strong>${money(db.lots.reduce((s,l)=>s+Number(l.freightTotal||0),0))}</strong><small>Fletes de entrada acumulados</small></div></div><div class="panel"><div class="panel-head"><div><h3>Compras recientes</h3><p>Cada ingreso conserva su costo propio.</p></div><button class="btn" onclick="setPage('inventory')">Ver inventario →</button></div><div class="table-wrap"><table><thead><tr><th>Lote</th><th>Fecha</th><th>Producto</th><th>Cantidad</th><th>Compra unitaria</th><th>Flete total</th><th>Costo puesto AQP / unidad</th><th>Acciones</th></tr></thead><tbody>${db.lots.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<tr><td><b>${esc(l.code)}</b></td><td>${dateFmt(l.date)}</td><td>${esc(product(l.productId)?.name||'Producto eliminado')}</td><td>${l.qty}</td><td>${money(l.purchaseCost)}</td><td>${money(l.freightTotal)}</td><td><b>${money(l.unitCost)}</b></td><td><button class="btn small" onclick="openLot('${l.id}')">Editar</button> <button class="btn small danger" title="Si el lote tiene ventas, la eliminación se bloqueará." onclick="deleteRecord('lots','${l.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table>${!db.lots.length?'<div class="empty"><b>Sin compras registradas</b>Agrega un producto y registra un lote para empezar.</div>':''}</div></div><p class="helper" style="margin-top:12px">Nota: el flete de entrada forma parte del costo de mercadería. No lo registres otra vez como gasto operativo, para evitar duplicarlo.</p>`}
function settingsPage(){return `<div class="page-head"><div><h1>Catálogos y ajustes</h1><p>Edita las listas desplegables y administra tus datos.</p></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h3>Vendedores</h3><p>Opciones disponibles en ventas</p></div></div>${listEditor('vendors',db.vendors)}<div class="field"><label>Agregar vendedor</label><div style="display:flex;gap:8px"><input id="newVendor" placeholder="Nombre del vendedor"><button class="btn primary" onclick="addOption('vendors','newVendor')">Agregar</button></div></div></section><section class="panel"><div class="panel-head"><div><h3>Canales de venta</h3><p>Origen del cliente o pedido</p></div></div>${listEditor('channels',db.channels)}<div class="field"><label>Agregar canal</label><div style="display:flex;gap:8px"><input id="newChannel" placeholder="Ej. Feria"><button class="btn primary" onclick="addOption('channels','newChannel')">Agregar</button></div></div></section><section class="panel"><div class="panel-head"><div><h3>Categorías de gastos</h3><p>Incluye decants y materiales</p></div></div>${listEditor('expenseCategories',db.expenseCategories)}<div class="field"><label>Agregar categoría</label><div style="display:flex;gap:8px"><input id="newExpenseCat" placeholder="Nueva categoría"><button class="btn primary" onclick="addOption('expenseCategories','newExpenseCat')">Agregar</button></div></div></section><section class="panel"><div class="panel-head"><div><h3>Medios de pago</h3><p>Opciones para gastos</p></div></div>${listEditor('paymentMethods',db.paymentMethods)}<div class="field"><label>Agregar medio de pago</label><div style="display:flex;gap:8px"><input id="newPayment" placeholder="Nuevo medio"><button class="btn primary" onclick="addOption('paymentMethods','newPayment')">Agregar</button></div></div></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Respaldo de datos</h3><p>Exporta una copia o restaura datos desde un archivo JSON.</p></div></div><div class="toolbar"><button class="btn" onclick="backupData()">⇩ Descargar respaldo JSON</button><label class="btn" for="restoreFile">⇧ Restaurar respaldo JSON</label><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreData(event)"></div><div class="notice red"><b>Importante:</b> el respaldo contiene información comercial y datos de clientes. Guárdalo en un lugar privado. No compartas este archivo públicamente.</div><p class="helper">Para usar la misma base desde dos dispositivos, hay que conectar Firebase Authentication y Cloud Firestore, configurar las reglas de acceso y probar la sincronización. El modo local actual no comparte información entre navegadores.</p></section>`}
function listEditor(key,arr){return `<div style="display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px">${arr.map((x,i)=>`<span class="pill" style="display:inline-flex;gap:7px;align-items:center">${esc(x)} <button title="Eliminar opción" onclick="removeOption('${key}',${i})" style="border:0;background:transparent;color:#b72c2c;padding:0">×</button></span>`).join('')}</div>`}
function modal(title,intro,body,saveLabel='Guardar'){ $('#modal').innerHTML=`<h2>${title}</h2><p class="intro">${intro||''}</p><form id="recordForm">${body}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">${saveLabel}</button></div></form>` ;$('#modalBack').classList.add('open');if($('#productName')&&!$('#recordForm input[name="productName"]')){setTimeout(()=>{$('#productName').focus();$('#productName').setSelectionRange($('#productName').value.length,$('#productName').value.length)},0)}const form=$('#recordForm');form.onsubmit=async e=>{e.preventDefault();if(form.dataset.busy==='1')return;form.dataset.busy='1';const submit=form.querySelector('button[type="submit"]');if(submit){submit.disabled=true;submit.textContent='Guardando…'}try{const fd=new FormData(form),file=fd.get('imageFile'),values={};for(const [k,val] of fd.entries())if(k!=='imageFile')values[k]=val;if(file&&file.size)values.imageData=await compressProductImage(file);modalSave(values)}catch(err){toast(err.message||'Revisa los datos ingresados')}finally{if($('#modalBack').classList.contains('open')){form.dataset.busy='0';if(submit){submit.disabled=false;submit.textContent=saveLabel}}}}}function closeModal(){$('#modalBack').classList.remove('open')}$('#modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack'){e.preventDefault();e.stopPropagation()}});function field(label,name,val='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" ${extra}></div>`}function selectField(label,name,opts,val='',extra=''){return `<div class="field"><label>${label}</label><select name="${name}" ${extra}>${opts.map(o=>`<option value="${esc(typeof o==='string'?o:o.value)}" ${(String(typeof o==='string'?o:o.value)===String(val))?'selected':''}>${esc(typeof o==='string'?o:o.label)}</option>`).join('')}</select></div>`}function optsProducts(){return db.products.map(p=>({value:p.id,label:p.name}))}function optsCustomers(){return [{value:'',label:'Cliente nuevo / venta directa'},...db.customers.map(c=>({value:c.id,label:c.name+' · '+c.phone}))]}function openProduct(id){
const p=db.products.find(x=>x.id===id)||{},isNew=!id;modalMode='product';editId=id||null;const currentStock=isNew?0:stock(id);
const body='<div class="form-grid">'
+field('SKU *','sku',p.sku||nextProductSku(),'text','required maxlength="40"')
+field('Categoría *','category',p.category||'Perfumería','text','required placeholder="Ej. Perfumería"')

+field('Precio de venta (S/) *','salePrice',p.salePrice??0,'number','required min="0" step="0.01"')
+field(isNew?'Stock inicial *':'Stock actual (unidades)','initialStock',currentStock,'number','required min="0" step="1" '+(isNew?'':'readonly'))
+field('Stock mínimo','minStock',p.minStock??10,'number','required min="0" step="1"')
+selectField('Estado','status',['Activo','Inactivo'],p.status||'Activo','required')
+'<div class="field full"><label for="imageFile">Imagen del producto</label><input id="imageFile" name="imageFile" type="file" accept="image/*">'
+(p.imageData?'<div style="margin-top:8px"><img src="'+esc(p.imageData)+'" alt="Imagen actual del producto" style="max-width:120px;max-height:120px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:5px"><div class="helper">Si no eliges otra imagen, se conserva la actual.</div></div>':'<div class="helper">Opcional. La imagen se reduce al guardarla para limitar el espacio usado.</div>')

}function openLot(id){const l=id?db.lots.find(x=>x.id===id):null;if(!l&&!db.products.length){toast('Primero crea un producto en Inventario.');openProduct();return}modalMode='lot';editId=id||null;const hasSales=Number(l?.sold||0)>0;modal(l?'Editar lote '+esc(l.code):'Registrar compra / lote',hasSales?'Este lote ya tiene ventas. Para proteger el historial, producto, cantidad, costo, precio de venta y flete quedan bloqueados; puedes editar fecha, proveedor, código y nota.':'Registra cantidad comprada, costo de entrada, precio al que venderás y flete de este lote.',`<div class="form-grid">${field('Fecha de compra *','date',l?.date||today(),'date','required')}${field('Nombre del producto *','productName',product(l?.productId||db.products[0]?.id)?.name||'','text','required autocomplete="off"')}${field('Código de lote *','code',l?.code||'LOTE-'+today().replaceAll('-','')+'-'+String(db.lots.length+1).padStart(3,'0'),'text','required')}${field('Cantidad comprada *','qty',l?.qty??'','number','required min="1" step="1" '+(hasSales?'readonly':''))}${field('Costo de compra por unidad (S/) *','purchaseCost',l?.purchaseCost??product(l?.productId||db.products[0]?.id)?.acquisitionPrice??'','number','required min="0" step="0.01" '+(hasSales?'readonly':''))}${field('Precio de venta por unidad (S/) *','salePrice',l?.salePrice??product(l?.productId||db.products[0]?.id)?.salePrice??'','number','required min="0" step="0.01" '+(hasSales?'readonly':''))}${field('Flete total de este lote (S/)','freightTotal',l?.freightTotal??0,'number','min="0" step="0.01" '+(hasSales?'readonly':''))}${field('Proveedor','supplier',l?.supplier||'')}<div class="field full"><label>Referencia / nota</label><textarea name="note" rows="3" placeholder="Detalles de la compra, comprobante o referencia">${esc(l?.note||'')}</textarea></div></div><div class="notice">Costo puesto en Arequipa = costo unitario de compra + flete total ÷ cantidad comprada.</div>`)}
function openCustomer(id){let c=db.customers.find(x=>x.id===id)||{};modalMode='customer';editId=id||null;modal(id?'Editar cliente':'Nuevo cliente','El teléfono debe ser único para detectar clientes recurrentes.',`<div class="form-grid">${field('Nombre y apellido *','name',c.name||'','text','required')}${field('Teléfono / WhatsApp *','phone',c.phone||'','tel','required')}${field('Distrito / zona','district',c.district||'')}${field('Notas','notes',c.notes||'')}</div>`)}function openExpense(id){const e=id?db.expenses.find(x=>x.id===id):null;modalMode='expense';editId=id||null;modal(e?'Editar gasto':'Registrar gasto operativo','Registra movilidad, entregas, materiales de decants y otros costos operativos.',`<div class="form-grid">${field('Fecha *','date',e?.date||today(),'date','required')}${selectField('Categoría *','category',db.expenseCategories,e?.category||db.expenseCategories[0]||'Otros')}${field('Detalle *','detail',e?.detail||'','text','required placeholder="Ej. 20 frascos de 5 ml"')}${field('Monto total (S/) *','amount',e?.amount??'','number','required min="0.01" step="0.01"')}${field('Cantidad de unidades (opcional)','qty',e?.qty??'','number','min="0" step="1"')}${field('Costo por unidad (opcional)','unitCost',e?.unitCost??'','number','min="0" step="0.01"')}${field('Proveedor / quién recibió','vendor',e?.vendor||'')}${selectField('Medio de pago','payment',db.paymentMethods,e?.payment||db.paymentMethods[0]||'Efectivo')}${field('Nota / comprobante','note',e?.note||'')}</div><p class="helper">Los importes aquí son gasto operativo. No dupliques el flete de entrada registrado en los lotes.</p>`)}

function addSaleItem(){let id=uid('item');selectedSaleItems.push({id,productId:'',lotId:'',qty:1,price:0,discount:0});drawSaleItems()}function drawSaleItems(){const host=$('#saleItems');if(!host)return;const oldSale=editId?db.sales.find(s=>s.id===editId):null;host.innerHTML=selectedSaleItems.map(it=>{const availableLots=it.productId?lotsFor(it.productId).filter(l=>stockLot(l)+lotSoldInSale(oldSale,l.id)>0):[];return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px"><div class="form-grid"><div class="field"><label>Producto *</label><select onchange="updateSaleItem('${it.id}','productId',this.value)"><option value="">Selecciona…</option>${db.products.filter(p=>stock(p.id)+(oldSale?(oldSale.items||[]).filter(i=>i.productId===p.id).reduce((a,i)=>a+Number(i.qty||0),0):0)>0).map(p=>`<option value="${p.id}" ${p.id===it.productId?'selected':''}>${esc(p.name)} · stock ${stock(p.id)+(oldSale?(oldSale.items||[]).filter(i=>i.productId===p.id).reduce((a,i)=>a+Number(i.qty||0),0):0)}</option>`).join('')}</select></div><div class="field"><label>Lote de salida *</label><select onchange="updateSaleItem('${it.id}','lotId',this.value)"><option value="">Selecciona lote…</option>${availableLots.map(l=>`<option value="${l.id}" ${l.id===it.lotId?'selected':''}>${esc(l.code)} · disponibles ${stockLot(l)+lotSoldInSale(oldSale,l.id)} · costo ${money(l.unitCost)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input type="number" min="1" step="1" value="${it.qty}" onchange="updateSaleItem('${it.id}','qty',this.value)"></div><div class="field"><label>Precio unitario (S/)</label><input type="number" min="0" step="0.01" value="${it.price}" onchange="updateSaleItem('${it.id}','price',this.value)"></div><div class="field"><label>Descuento total de esta línea (S/)</label><input type="number" min="0" step="0.01" value="${it.discount}" onchange="updateSaleItem('${it.id}','discount',this.value)"></div><div class="field"><label>C function updateSaleItem(id,key,val){let it=selectedSaleItems.find(x=>x.id===id);if(!it)return;it[key]=['qty','price','discount'].includes(key)?Number(val):val;if(key==='productId'){it.lotId='';it.price=Number(product(val)?.salePrice||0)}if(key==='lotId'){const l=db.lots.find(x=>x.id===val);if(l)it.price=Number(l.salePrice??product(it.productId)?.salePrice??0)}drawSaleItems()}function removeSaleItem(id){selectedSaleItems=selectedSaleItems.filter(x=>x.id!==id);drawSaleItems()}function updateSalePreview(){let el=$('#saleTotalsPreview');if(!el)return;let rev=0,cost=0,disc=0;selectedSaleItems.forEach(i=>{rev+=Number(i.qty||0)*Number(i.price||0)-Number(i.discount||0);disc+=Number(i.discount||0);cost+=Number(i.qty||0)*Number(lotsFor(i.productId).find(l=>l.id===i.lotId)?.unitCost||0)});el.innerHTML=`<div class="kpi-line"><div><small>Venta neta</small><b>${money(rev)}</b></div><div><small>Costo de venta</small><b>${money(cost)}</b></div><div><small>Descuento</small><b>${money(disc)}</b></div><div><small>Utilidad bruta</small><b class="${rev-cost>=0?'profit':'loss'}">${money(rev-cost)}</b></div></div>`}
function modalSave(v){if(modalMode==='product'){const name=(v.name||'').trim(),sku=(v.sku||'').trim().toUpperCase(),acquisitionPrice=Number(v.acquisitionPrice||0),salePrice=Number(v.salePrice||0),initialStock=Number(v.initialStock||0),minStock=Number(v.minStock||0),old=editId?db.products.find(x=>x.id===editId):null;if(!name)throw Error('Ingresa el nombre del producto.');if(!sku)throw Error('Ingresa el SKU.');if(db.products.some(x=>String(x.sku||'').toUpperCase()===sku&&x.id!==editId))throw Error('Ese SKU ya está asignado a otro producto.');if(!Number.isFinite(acquisitionPrice)||acquisitionPrice<0||!Number.isFinite(salePrice)||salePrice<0||!Number.isInteger(initialStock)||initialStock<0||!Number.isInteger(minStock)||minStock<0)throw Error('Revisa los precios y las cantidades. Stock inicial y mínimo deben ser enteros iguales o mayores que cero.');if(editId&&initialStock!==stock(editId))throw Error('Para cambiar las existencias, registra una compra/lote; así se conserva el historial.');const p={id:editId||uid('prod'),sku,category:(v.category||'').trim(),name,description:(v.description||'').trim(),brand:(v.brand||'').trim(),size:(v.size||'').trim(),acquisitionPrice,salePrice,minStock,status:['Activo','Inactivo'].includes(v.status)?v.status:'Activo',imageData:v.imageData||old?.imageData||''};if(editId)db.products=db.products.map(x=>x.id===editId?p:x);else{db.products.push(p);if(initialStock>0){const lotId=uid('lot'),code='INI-'+sku+'-'+today().replaceAll('-','');const lot={id:lotId,code,date:today(),productId:p.id,qty:initialStock,sold:0,purchaseCost:acquisitionPrice,salePrice,freightTotal:0,unitCost:acquisitionPrice,supplier:'Inventario inicial',note:'Lote inicial generado desde la ficha del producto'};db.lots.push(lot);db.purchases.push({id:lotId,date:lot.date,productId:p.id,qty:initialStock,amount:initialStock*acquisitionPrice})}}persist();closeModal();render();toast(editId?'Producto actualizado.':initialStock>0?'Producto creado con stock inicial y lote generado.':'Pr ||uid('lot'),code,date:v.date,productId,qty,sold:Number(old?.sold||0),purchaseCost:pc,salePrice:sp,freightTotal:fr,unitCost:pc+fr/qty,supplier:(v.supplier||'').trim(),note:(v.note||'').trim()};if(old){db.lots=db.lots.map(x=>x.id===old.id?l:x);db.purchases=db.purchases.map(x=>x.id===old.id?{...x,date:l.date,productId:l.productId,qty,amount:qty*pc+fr}:x)}else{db.lots.push(l);db.purchases.push({id:l.id,date:l.date,productId:l.productId,qty,amount:qty*pc+fr})}persist();closeModal();render();toast(old?'Lote actualizado.':'Lote ingresado. Stock actualizado.')}else if(modalMode==='customer'){if(!v.name.trim()||!v.phone.trim())throw Error('Nombre y teléfono son obligatorios.');if(db.customers.some(c=>normPhone(c.phone)===normPhone(v.phone)&&c.id!==editId))throw Error('Ya existe un cliente con ese teléfono.');const c={id:editId||uid('cli'),name:v.name.trim(),phone:v.phone.trim(),district:(v.district||'').trim(),notes:(v.notes||'').trim(),createdAt:db.customers.find(x=>x.id===editId)?.createdAt||today()};if(editId)db.customers=db.customers.map(x=>x.id===editId?c:x);else db.customers.push(c);persist();closeModal();render();toast('Cliente guardado.')}else if(modalMode==='expense'){const amount=Number(v.amount);if(!v.date||!Number.isFinite(amount)||amount<=0)throw Error('La fecha es obligatoria y el monto debe ser mayor a cero.');const record={id:editId||uid('gas'),date:v.date,category:v.category,detail:(v.detail||'').trim(),amount,qty:Number(v.qty||0),unitCost:Number(v.unitCost||0),vendor:(v.vendor||'').trim(),payment:v.payment,note:(v.note||'').trim()};if(editId)db.expenses=db.expenses.map(x=>x.id===editId?record:x);else db.expenses.push(record);persist();closeModal();render();toast(editId?'Gasto actualizado.':'Gasto registrado.')}else if(modalMode==='sale'){saveSale(v)}}
function saveSale(v){if(!selectedSaleItems.length)throw Error('Agrega al menos un producto.');const old=editId?db.sales.find(s=>s.id===editId):null,requiredByLot=new Map(),items=[];for(const it of selectedSaleItems){const l=db.lots.find(x=>x.id===it.lotId),p=product(it.productId),qty=Number(it.qty),price=Number(it.price),discount=Number(it.discount||0);if(!p||!l)throw Error('Selecciona producto y lote en cada línea.');if(!Number.isInteger(qty)||qty<1)throw Error('La cantidad debe ser un entero positivo.');if(!Number.isFinite(price)||price<0)throw Error('El precio debe ser un número igual o mayor que cero.');if(!Number.isFinite(discount)||discount<0||discount>qty*price)throw Error('El descuento no puede superar el importe de la línea.');if(l.productId!==p.id)throw Error('El lote no corresponde al producto elegido.');requiredByLot.set(l.id,(requiredByLot.get(l.id)||0)+qty);items.push({productId:p.id,name:p.name,lotId:l.id,lotCode:l.code,qty,price,discount,unitCost:Number(l.unitCost??(Number(l.purchaseCost||0)+Number(l.freightTotal||0)/Math.max(1,Number(l.qty||1))))})}for(const [lotId,qty] of requiredByLot){const l=db.lots.find(x=>x.id===lotId),available=stockLot(l)+lotSoldInSale(old,lotId);if(qty>available)throw Error(`Stock insuficiente en el lote ${l.code}: quedan ${available} unidades disponibles para esta operación.`)}let cid=v.customerId||'',name=(v.customerName||'').trim(),phone=(v.phone||'').trim(),c=cid?db.customers.find(x=>x.id===cid):null;if(!c&&phone)c=db.customers.find(x=>normPhone(x.phone)===normPhone(phone));if(!c&&name)c=db.customers.find(x=>normText(x.name)===normText(name));if(!c&&name&&phone){c={id:uid('cli'),name,phone,district:'',notes:'',createdAt:today()};db.customers.push(c)}const total=items.reduce((a,i)=>a+Number(i.qty||0)*Number(i.price||0)-Number(i.discount||0),0),paid=Number(v.amountPaid||0);if(!Number.isFinite(paid)||paid<0||paid>total)throw Error('El monto pagado no puede ser negativo ni superar el total de la venta.');const previousPaid= function addPayment(id){const s=db.sales.find(x=>x.id===id);if(!s)return;const total=saleTotals(s).revenue,balance=Math.max(0,total-Number(s.amountPaid||0));const raw=prompt(`Venta ${id}\nTotal: ${money(total)}\nPagado: ${money(s.amountPaid||0)}\nSaldo pendiente: ${money(balance)}\n\n¿De cuánto es el nuevo abono? (S/)`,'');if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0||amount>balance){toast('Ingresa un abono mayor a cero y no superior al saldo pendiente.');return}const note=prompt('Detalle del abono (opcional):','')||'Abono';s.amountPaid=Number(s.amountPaid||0)+amount;s.paymentHistory=Array.isArray(s.paymentHistory)?s.paymentHistory:[];s.paymentHistory.push({date:today(),amount,note});persist();render();toast('Abono registrado; saldo actualizado.')}function deleteSale(id){const s=db.sales.find(x=>x.id===id);if(!s)return;if(!confirm(`Eliminar la venta ${id} y devolver sus unidades al inventario? Esta acción no se puede deshacer.`))return;for(const it of s.items||[]){const l=db.lots.find(x=>x.id===it.lotId);if(l)l.sold=Math.max(0,Number(l.sold||0)-Number(it.qty||0))}db.sales=db.sales.filter(x=>x.id!==id);persist();render();toast('Venta eliminada; el stock de los lotes fue restaurado.')}

function viewSale(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let t=saleTotals(s),balance=Math.max(0,t.revenue-Number(s.amountPaid||0));modal('Detalle de venta '+s.id,`${dateFmt(s.date)} · ${esc(s.customerName)} · Vendedor: ${esc(s.seller)}`,`<div class="mini-stat"><span>Total de la venta</span><b>${money(t.revenue)}</b></div><div class="mini-stat"><span>Total pagado</span><b>${money(s.amountPaid||0)}</b></div><div class="mini-stat"><span>Saldo pendiente</span><b class="${balance>0?'loss':'profit'}">${money(balance)}</b></div>${s.paymentHistory?.length?`<h3>Historial de abonos</h3><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Importe</th><th>Detalle</th></tr></thead><tbody>${s.paymentHistory.map(p=>`<tr><td>${dateFmt(p.date)}</td><td>${money(p.amount)}</td><td>${esc(p.note||'Abono')}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="table-wrap"><table><thead><tr><th>Producto / lote</th><th>Cant.</th><th>Precio</th><th>Desc.</th><th>Costo unit.</th></tr></thead><tbody>${s.items.map(i=>`<tr><td>${esc(i.name)}<div class="sub">${esc(i.lotCode)}</div></td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.discount)}</td><td>${money(i.unitCost)}</td></tr>`).join('')}</tbody></table></div><div class="mini-stat"><span>Venta neta</span><b>${money(t.revenue)}</b></div><div class="mini-stat"><span>Costo de venta</span><b>${money(t.cost)}</b></div><div class="mini-stat"><span>Utilidad bruta</span><b class="profit">${money(t.gross)}</b></div><div class="mini-stat"><span>Canal / pago</span><b>${esc(s.channel)} / ${esc(s.payment)}</b></div>`,'Cerrar');$('#recordForm').onsubmit=e=>{e.preventDefault();closeModal()};$('#recordForm .form-actions').innerHTML='<button type="button" class="btn primary" onclick="closeModal()">Cerrar</button>'}
function showLots(pid){const p=product(pid);if(!p)return;const ls=lotsFor(pid);modal('Lotes · '+esc(p.name),'Los lotes vendidos conservan su costo histórico. Edita o elimina los que no tengan movimientos.',`<div class="table-wrap"><table><thead><tr><th>Lote</th><th>Fecha</th><th>Compradas</th><th>Vendidas</th><th>Stock</th><th>Compra unit.</th><th>Flete/u.</th><th>Costo AQP</th><th>Precio venta</th><th>Acciones</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${esc(l.code)}</td><td>${dateFmt(l.date)}</td><td>${l.qty}</td><td>${l.sold}</td><td>${stockLot(l)}</td><td>${money(l.purchaseCost)}</td><td>${money(Number(l.freightTotal||0)/Math.max(1,Number(l.qty||1)))}</td><td><b>${money(l.unitCost)}</b></td><td>${money(l.salePrice??product(l.productId)?.salePrice??0)}</td><td><button type="button" class="btn small" onclick="openLot('${l.id}')">Editar</button> <button type="button" class="btn small danger" title="Si tiene ventas asociadas, la eliminación se bloqueará para proteger el historial." onclick="deleteLotFromModal('${l.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`,'Cerrar');$('#recordForm').onsubmit=e=>{e.preventDefault();closeModal()};$('#recordForm .form-actions').innerHTML='<button type="button" class="btn primary" onclick="closeModal()">Cerrar</button>'}
function closeModalIfOpen(){closeModal()}function deleteLotFromModal(id){const before=db.lots.length;deleteRecord('lots',id);if(db.lots.length<before)closeModal()}
function customerHistory(id){let c=db.customers.find(x=>x.id===id),ss=db.sales.filter(s=>s.customerId===id);modal('Historial · '+esc(c?.name||'Cliente'),`${esc(c?.phone||'')} · ${ss.length} compra(s)`,`${ss.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Pedido</th><th>Productos</th><th>Total</th><th>Utilidad bruta</th></tr></thead><tbody>${ss.map(s=>{let t=saleTotals(s);return `<tr><td>${dateFmt(s.date)}</td><td>${esc(s.id)}</td><td>${s.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</td><td>${money(t.revenue)}</td><td>${money(t.gross)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Aún no registra compras.</div>'}`,'Cerrar');$('#recordForm').onsubmit=e=>{e.preventDefault();closeModal()};$('#recordForm .form-actions').innerHTML='<button type="button" class="btn primary" onclick="closeModal()">Cerrar</button>'}
function deleteRecord(key,id){const label=({expenses:'gasto',customers:'cliente',products:'producto',lots:'lote'})[key]||'registro';if(!confirm(`¿Eliminar este ${label}? Esta acción no se puede deshacer.`))return;if(key==='expenses'){db.expenses=db.expenses.filter(x=>x.id!==id)}else if(key==='customers'){if(db.sales.some(s=>s.customerId===id)){if(!confirm('Este cliente tiene historial de ventas. Se quitará de la lista de clientes, pero se conservarán las ventas y sus saldos por cobrar con el nombre guardado. ¿Continuar?'))return;db.sales=db.sales.map(s=>s.customerId===id?{...s,customerId:''}:s)}db.customers=db.customers.filter(x=>x.id!==id)}else if(key==='products'){if(db.lots.some(l=>l.productId===id)||db.sales.some(s=>(s.items||[]).some(i=>i.productId===id))){toast('No se puede eliminar: el producto tiene historial de inventario o ventas.');return}db.products=db.products.filter(x=>x.id!==id)}else if(key==='lots'){const l=db.lots.find(x=>x.id===id);if(!l)return;if(Number(l.sold||0)>0||db.sales.some(s=>(s.items||[]).some(i=>i.lotId===id))){toast('No se puede eliminar un lote con ventas asociadas.');return}db.lots=db.lots.filter(x=>x.id!==id);db.purchases=db.purchases.filter(x=>x.id!==id)}persist();render();toast('Registro eliminado.')}
function addOption(key,inputId){let el=$('#'+inputId),v=el.value.trim();if(!v)return;if(!db[key].includes(v))db[key].push(v);persist();render();toast('Opción agregada.')}function removeOption(key,i){if(!confirm('¿Quitar esta opción de la lista desplegable?'))return;db[key].splice(i,1);persist();render()}function filterTable(inputId,tableId){let q=$('#'+inputId).value.toLowerCase();$$('#'+tableId+' tbody tr').forEach(tr=>tr.style.display=(tr.dataset.search||tr.innerText.toLowerCase()).includes(q)?'':'none')}function exportCSV(type){let rows=[],name=type;const push=(head,data)=>{rows=[head,...data]};if(type==='inventory'){push(['SKU','Categoría','Producto','Descripción','Marca','Presentación','Estado','Precio adquisición','Precio venta','Stock','Stock mínimo','Costo promedio AQP','Valor stock al costo','Valor potencial de venta','Utilidad bruta potencial'],db.products.map(p=>[p.sku,p.category,p.name,p.description,p.brand,p.size,p.status,p.acquisitionPrice,p.salePrice,stock(p.id),p.minStock,averageCost(p.id),stockCostValue(p.id),stockPotentialValue(p.id),stockPotentialProfit(p.id)]))}if(type==='sales'){push(['Pedido','Fecha','Cliente','Teléfono','Vendedor','Canal','Producto','Lote','Cantidad','Costo unitario AQP','Precio unitario','Descuento línea','Venta neta línea','Costo venta línea','Utilidad bruta línea'],db.sales.flatMap(s=>s.items.map(i=>[s.id,s.date,s.customerName,s.phone,s.seller,s.channel,i.name,i.lotCode,i.qty,i.unitCost,i.price,i.discount,i.qty*i.price-i.discount,i.qty*i.unitCost,i.qty*i.price-i.discount-i.qty*i.unitCost])))}if(type==='customers'){push(['Nombre','Teléfono','Distrito','Fecha registro','Compras','Total comprado'],db.customers.map(c=>{let ss=db.sales.filter(s=>s.customerId===c.id);return[c.name,c.phone,c.district,c.createdAt,ss.length,ss.reduce((a,s)=>a+saleTotals(s).revenue,0)]}))}if(type==='expenses'){push(['Fecha','Categoría','Detalle','Monto','Cantidad','Costo unitario','Proveedor','Medio pago','Nota'],db.expenses.map(e=>[e.date,e.category,e.detail,e.amount,e.qty,e.unitCost,e.vendor,e.payment,e.note]))}let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='trendia_'+name+'_'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backupData(){downloadBlob(JSON.stringify({...db,backupCreatedAt:new Date().toISOString(),appVersion:'TRENDIA-ADMIN-2'},null,2),`respaldo_trendia_${today()}.json`,'application/json;charset=utf-8');toast('Respaldo JSON descargado.')}

function exportAllExcel(){
 const escXml=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
 const sheets=[];
 const add=(name,head,rows)=>sheets.push(`<Worksheet ss:Name="${escXml(name)}"><Table><Row>${head.map(v=>`<Cell><Data ss:Type="String">${escXml(v)}</Data></Cell>`).join('')}</Row>${rows.map(r=>`<Row>${r.map(v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${escXml(v)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`);
 add('Inventario',['SKU','Categoría','Producto','Descripción','Marca','Presentación','Estado','Precio adquisición','Precio venta','Stock','Stock mínimo','Costo promedio AQP','Valor stock al costo','Valor potencial de venta','Utilidad bruta potencial'],db.products.map(p=>[p.sku,p.category,p.name,p.description,p.brand,p.size,p.status,p.acquisitionPrice,p.salePrice,stock(p.id),p.minStock,averageCost(p.id),stockCostValue(p.id),stockPotentialValue(p.id),stockPotentialProfit(p.id)]));
 add('Lotes',['Lote','Fecha','Producto','Proveedor','Cantidad inicial','Vendidas','Stock','Costo compra unit.','Flete total','Costo unitario AQP'],db.lots.map(l=>[l.code,l.date,product(l.productId)?.name||'',l.supplier,l.qty,l.sold,stockLot(l),l.purchaseCost,l.freightTotal,l.unitCost]));
 add('Ventas',['Pedido','Fecha','Cliente','Teléfono','Vendedor','Canal','Producto','Lote','Cantidad','Costo unitario AQP','Precio unitario','Descuento','Venta neta línea','Costo venta línea','Utilidad bruta línea'],db.sales.flatMap(s=>s.items.map(i=>[s.id,s.date,s.customerName,s.phone,s.seller,s.channel,i.name,i.lotCode,i.qty,i.unitCost,i.price,i.discount,i.qty*i.price-i.discount,i.qty*i.unitCost,i.qty*i.price-i.discount-i.qty*i.unitCost])));
 add('Clientes',['Nombre','Teléfono','Distrito','Fecha registro','N.º compras','Total comprado'],db.customers.map(c=>{let ss=db.sales.filter(s=>s.customerId===c.id);return[c.name,c.phone,c.district,c.createdAt,ss.length,ss.reduce((a,s)=>a+saleTotals(s).revenue,0)]}));
 add('Gastos',['Fecha','Categoría','Detalle','Monto','Cantidad','Costo unitario','Proveedor','Medio pago','Nota'],db.expenses.map(e=>[e.date,e.category,e.detail,e.amount,e.qty,e.unitCost,e.vendor,e.payment,e.note]));
 add('Compras',['Fecha','Producto','Cantidad','Importe total'],db.purchases.map(x=>[x.date,product(x.productId)?.name||'',x.qty,x.amount]));
 add('Dashboards guardados',['Nombre','Mes','Guardado','Ventas netas','Costo venta','Utilidad bruta','Gastos','Resultado neto','Descuentos','Unidades','Pedidos'],(db.dashboardSnapshots||[]).map(x=>[x.name,x.month,x.savedAt,x.metrics?.revenue||0,x.metrics?.cost||0,x.metrics?.gross||0,x.metrics?.expenses||0,x.metrics?.net||0,x.metrics?.discount||0,x.metrics?.units||0,x.metrics?.orders||0]));
 const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheets.join('')}</Workbook>`;
 downloadBlob('\ufeff'+xml,'trendia_todo_'+today()+'.xls','application/vnd.ms-excel;charset=utf-8');toast('Excel completo descargado.');
}

function saleNotePDF(id){const s=db.sales.find(x=>x.id===id);if(!s)return;const w=window.open('','_blank');if(!w){toast('Permite las ventanas emergentes para generar la nota.');return;}w.document.open();w.document.write(saleNoteHTML(s));w.document.close();}
function sendSaleWhatsApp(id){const s=db.sales.find(x=>x.id===id);if(!s)return;const phone=String(s.phone||'').replace(/\D/g,'');if(!phone){toast('Esta venta no tiene teléfono del cliente.');return;}const text=`Hola ${s.customerName||''}, gracias por tu compra en TRENDIA. Tu pedido ${s.id} del ${dateFmt(s.date)} suma ${money(saleTotals(s).revenue)}. Te estamos compartiendo tu nota de venta. ¡Gracias por tu preferencia!`;window.open('https://wa.me/'+(phone.startsWith('51')?phone:'51'+phone)+'?text='+encodeURIComponent(text),'_blank','noopener');toast('WhatsApp abierto. Genera y adjunta el PDF manualmente en el chat.');}
function restoreData(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const arrays=['products','lots','sales','customers','expenses'];for(const key of arrays)if(x[key]!==undefined&&!Array.isArray(x[key]))throw Error(`La sección ${key} no tiene un formato válido.`);if(!Array.isArray(x.products)||!Array.isArray(x.lots)||!Array.isArray(x.sales))throw Error('El archivo no parece ser un respaldo TRENDIA válido.');for(const l of x.lots){if(!l.id||!l.productId||!Number.isFinite(Number(l.qty))||Number(l.qty)<0||Number(l.sold||0)<0||Number(l.sold||0)>Number(l.qty))throw Error('Hay un lote inválido o con más unidades vendidas que las compradas. No se aplicaron cambios.')}for(const sale of x.sales){if(!sale.id||!Array.isArray(sale.items))throw Error('Hay una venta inválida. No se aplicaron cambios.')}if(!confirm('Restaurar reemplazará todos los datos actuales de este navegador. Descarga un respaldo previo si lo necesitas. ¿Continuar?'))return;const merged={...defaults(),...x};for(const key of arrays)if(!Array.isArray(merged[key]))merged[key]=[];if(!Array.isArray(merged.dashboardSnapshots))merged.dashboardSnapshots=[];merged.lots=merged.lots.map(l=>({...l,sold:Number(l.sold||0),purchaseCost:Number(l.purchaseCost||0),freightTotal:Number(l.freightTotal||0),unitCost:Number(l.unitCost??(Number(l.purchaseCost||0)+Number(l.freightTotal||0)/Math.max(1,Number(l.qty||1))))}));db=merged;if(!persist())throw Error('No se pudo guardar en el navegador. Descarga o revisa el almacenamiento.');render();toast('Respaldo restaurado correctamente.')}catch(err){toast('No se pudo restaurar: '+err.message)}finally{e.target.value=''}};r.readAsText(f)}
render();
