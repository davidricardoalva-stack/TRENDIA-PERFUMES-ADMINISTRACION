<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e85b2a"><title>TRENDIA PERFUMES · Finanzas</title>
<style>
:root{--orange:#e85b2a;--red:#cf3c2d;--ink:#20242c;--muted:#707784;--line:#e8eaf0;--bg:#f5f6fa;--white:#fff;--green:#14804a;--teal:#0f8b82;--amber:#bd7417;--shadow:0 8px 28px #20242c0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.side{background:#20232a;color:white;padding:22px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 18px}.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff9b35,#df3b28);font-size:22px}.brand strong{font-size:17px;letter-spacing:1px;display:block}.brand small{font-size:10px;color:#c9cbd1}.navlabel{font-size:10px;letter-spacing:1.5px;color:#a7aab2;padding:8px 10px}.nav button{width:100%;border:0;color:#e8e9ed;background:transparent;padding:11px 12px;text-align:left;border-radius:9px;margin:2px 0}.nav button.active,.nav button:hover{background:#393d46;color:white}.nav button span{display:inline-block;width:25px;color:#ff9a61}.sidefoot{margin-top:auto;font-size:11px;color:#b7bbc3;line-height:1.7}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:17px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}.top h1{font-size:20px;margin:0}.top p{margin:2px 0 0;color:var(--muted);font-size:12px}.content{padding:24px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.head h2{margin:0;font-size:23px}.head p{margin:4px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:var(--ink);font-weight:600}.btn.primary{background:var(--orange);border-color:var(--orange);color:white}.btn.dark{background:#252932;color:white;border-color:#252932}.btn.danger{color:#b42318}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.metric,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}.metric small{display:block;color:var(--muted);font-size:11px}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;letter-spacing:-.6px;margin:7px 0 5px}.metric .sub{font-size:11px;color:var(--muted)}.green{color:var(--green)}.orange{color:var(--orange)}.teal{color:var(--teal)}.amber{color:var(--amber)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:17px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel h3{font-size:15px;margin:0 0 4px}.panel .desc{color:var(--muted);font-size:12px;margin:0 0 14px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}.field label{font-size:12px;color:#525967;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe2e8;border-radius:8px;padding:10px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;min-width:600px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f3;vertical-align:top}th{color:#6c7380;font-weight:650;background:#fafbfc;white-space:nowrap}td strong{font-size:12px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;background:#f1f3f6;color:#5c6470}.pill.green{background:#e6f5ec;color:#167344}.pill.orange{background:#fff0e8;color:#b64c1b}.pill.teal{background:#e3f6f4;color:#08766f}.bar{height:8px;border-radius:100px;background:#eef0f4;overflow:hidden}.bar span{display:block;height:100%;border-radius:100px}.allocrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:13px 0}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.note{background:#fff7ed;border:1px solid #fed7aa;padding:12px 14px;border-radius:10px;color:#8a4319;font-size:12px;margin:12px 0}.successnote{background:#ecfdf3;border:1px solid #abefc6;padding:12px 14px;border-radius:10px;color:#067647;font-size:12px;margin:12px 0}.hide{display:none!important}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px}.sectiontitle h3{margin:0;font-size:15px}.toast{position:fixed;bottom:18px;right:18px;background:#252932;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;display:none;max-width:90vw}.footnote{font-size:11px;color:var(--muted);margin-top:10px}.checkboxline{display:flex;gap:8px;align-items:center;font-size:12px;margin:8px 0}.checkboxline input{width:auto}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:6px 8px;font-size:11px}.monthbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.monthbar input{border:1px solid var(--line);padding:8px;border-radius:8px;background:white}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:205px minmax(0,1fr)}.content{padding:18px}}@media(max-width:720px){.layout{display:block}.side{position:static;padding:12px;gap:8px}.brand{padding-bottom:4px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto;padding:9px 10px;font-size:12px}.navlabel,.sidefoot{display:none}.top{position:static;padding:13px 15px}.content{padding:13px}.head{display:block}.head .btn{margin-top:12px}.cards,.grid2,.grid3,.row{grid-template-columns:1fr}.metric strong{font-size:23px}.panel{padding:13px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="logo">🛍</div><div><strong>TRENDIA</strong><small>PERFUMES · CONTROL FINANCIERO</small></div></div><div><div class="navlabel">ADMINISTRACIÓN</div><nav class="nav" id="nav"><button class="active" data-page="overview"><span>▦</span>Resumen general</button><button data-page="allocation"><span>◉</span>Utilidad distribuible</button><button data-page="cash"><span>↔</span>Caja y movimientos</button><button data-page="decants"><span>◌</span>Decants y ml</button><button data-page="supplies"><span>▣</span>Materiales y equipos</button><button data-page="expenses"><span>↘</span>Gastos y provisiones</button><button data-page="reports"><span>▤</span>Informes</button></nav></div><div class="sidefoot">TRENDIA PERFUMES<br>Controla cada sol. Evita duplicar movimientos.<br><a href="index.html" style="color:#ffb18d">← Volver a administración principal</a></div></aside><main class="main"><header class="top"><div><h1 id="title">Resumen general</h1><p id="today"></p></div><div class="actions"><a class="btn" href="index.html" style="text-decoration:none">Administración principal</a><button class="btn" onclick="downloadBackup()">Exportar respaldo</button></div></header><div class="content" id="app"></div></main></div><div class="toast" id="toast"></div>
<script>
const KEY='trendia-admin-v1', FIN='trendia-finance-v1';const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));const today=()=>new Date().toISOString().slice(0,10);const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});const num=v=>Math.max(0,Number(v)||0);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page='overview',month=today().slice(0,7);
function base(){return {version:1,allocations:[],cashMoves:[],decantBottles:[],materials:[],decantSales:[],expenses:[],provisions:[],settings:{reinvest:50,reserve:30,owner:20},monthlyNotes:[]}}
function loadFin(){try{return {...base(),...JSON.parse(localStorage.getItem(FIN)||'{}')}}catch(e){return base()}}let f=loadFin();
function loadMain(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(){localStorage.setItem(FIN,JSON.stringify(f));toast('Guardado automáticamente en este dispositivo.');render()}
function saveMain(d){localStorage.setItem(KEY,JSON.stringify(d));}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2600)}
function existing(){const d=loadMain();return {sales:Array.isArray(d.sales)?d.sales:[],lots:Array.isArray(d.lots)?d.lots:[],products:Array.isArray(d.products)?d.products:[],expenses:Array.isArray(d.expenses)?d.expenses:[],purchases:Array.isArray(d.purchases)?d.purchases:[]}}
function saleRevenue(s){return (s.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.price)-num(i.discount),0)}
function saleCost(s){return (s.items||[]).reduce((a,i)=>a+num(i.qty)*num(i.unitCost),0)}
function existingSales(){return existing().sales.reduce((a,s)=>a+saleRevenue(s),0)}
function currentSales(){return existing().sales.filter(s=>(s.date||'').slice(0,7)===month)}
function ownSales(){return f.decantSales.filter(s=>(s.date||'').slice(0,7)===month)}
function ownExpenses(){return f.expenses.filter(e=>(e.date||'').slice(0,7)===month)}
function cashBalance(){return f.cashMoves.reduce((a,m)=>a+(m.direction==='in'?num(m.amount):-num(m.amount)),0)}
function bottleRemaining(b){return Math.max(0,num(b.mlInitial)-num(b.mlUsed))}
function costPerMl(b){return num(b.costTotal)/(num(b.mlInitial)||1)}
function supplyCost(id){const m=f.materials.find(x=>x.id===id);return m?num(m.unitCost):0}
function soldDecantCost(s){return num(s.perfumeCost)+num(s.materialCost)+num(s.packagingCost)}
function monthPnl(){const sales=currentSales(),existingRevenue=sales.reduce((a,s)=>a+saleRevenue(s),0),existingCost=sales.reduce((a,s)=>a+saleCost(s),0),dec=ownSales(),decRevenue=dec.reduce((a,s)=>a+num(s.total),0),decCost=dec.reduce((a,s)=>a+soldDecantCost(s),0),oldExp=existing().expenses.filter(e=>(e.date||'').slice(0,7)===month).reduce((a,e)=>a+num(e.amount),0),newExp=ownExpenses().reduce((a,e)=>a+num(e.amount),0);return {existingRevenue,existingCost,decRevenue,decCost,oldExp,newExp,revenue:existingRevenue+decRevenue,cost:existingCost+decCost,gross:existingRevenue+decRevenue-existingCost-decCost,expenses:oldExp+newExp,net:existingRevenue+decRevenue-existingCost-decCost-oldExp-newExp}}
function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-PE'):'—'}
function shell(title,body){$('#title').textContent=title;$('#app').innerHTML=body}
function metric(label,value,sub,cls){return '<div class="metric"><div class="label">'+label+'</div><strong class="'+(cls||'')+'">'+value+'</strong><div class="sub">'+sub+'</div></div>'}
function pageHead(title,desc,action){return '<div class="head"><div><h2>'+title+'</h2><p>'+desc+'</p></div>'+(action||'')+'</div>'}
function overview(){const p=monthPnl(),bal=cashBalance(),reserve=f.cashMoves.filter(m=>m.bucket==='reserve'&&m.direction==='in').reduce((a,m)=>a+num(m.amount),0)-f.cashMoves.filter(m=>m.bucket==='reserve'&&m.direction==='out').reduce((a,m)=>a+num(m.amount),0),stock=existing().lots.reduce((a,l)=>a+Math.max(0,num(l.qty)-num(l.sold))*num(l.purchaseCost),0),ml=f.decantBottles.reduce((a,b)=>a+bottleRemaining(b),0);return pageHead('Control financiero','Un solo negocio, dos líneas y todos los movimientos trazables. <span class="pill">Periodo '+month+'</span>','<div class="monthbar"><input type="month" id="monthPick" value="'+month+'" onchange="setMonth(this.value)"></div>')+'<div class="cards">'+metric('Ventas del mes',money(p.revenue),'Perfumes completos + decants')+metric('Utilidad estimada',money(p.net),'Después de costo y gastos',p.net>=0?'green':'orange')+metric('Caja registrada',money(bal),'Movimientos ingresados')+metric('Perfume disponible para decants',ml.toFixed(1)+' ml','Botellas madre registradas','teal')+'</div><div class="grid2"><section class="panel"><h3>Resultado del periodo</h3><p class="desc">Las ventas y gastos de la administración principal se leen desde su almacenamiento local; los decants y movimientos nuevos se registran aquí.</p><div class="tablewrap"><table><tbody><tr><td>Ventas de perfumes completos</td><td><strong>'+money(p.existingRevenue)+'</strong></td></tr><tr><td>Ventas de decants</td><td><strong>'+money(p.decRevenue)+'</strong></td></tr><tr><td>Costo de ventas</td><td>'+money(p.cost)+'</td></tr><tr><td>Utilidad bruta estimada</td><td>'+money(p.gross)+'</td></tr><tr><td>Gastos registrados</td><td>'+money(p.expenses)+'</td></tr><tr><td><strong>Utilidad neta estimada</strong></td><td><strong>'+money(p.net)+'</strong></td></tr></tbody></table></div><p class="footnote">Revisa que cada gasto esté registrado en un solo módulo. La utilidad mostrada es de gestión y no sustituye el cierre contable tributario.</p></section><section class="panel"><h3>Política de utilidad</h3><p class="desc">Distribución sugerida aplicada a la utilidad distribuible, no a las ventas.</p>'+allocBars(p.net)+'<button class="btn primary" onclick="go(\'allocation\')">Calcular distribución</button></section></div><div class="grid2"><section class="panel"><h3>Capital y stock</h3><p class="desc">Indicadores operativos, no todos equivalen a efectivo disponible.</p><div class="tablewrap"><table><tbody><tr><td>Valor de stock de perfumes completos (costo registrado)</td><td>'+money(stock)+'</td></tr><tr><td>Botellas madre de decants</td><td>'+f.decantBottles.length+'</td></tr><tr><td>Mililitros disponibles para decants</td><td>'+ml.toFixed(1)+' ml</td></tr><tr><td>Materiales registrados</td><td>'+f.materials.length+'</td></tr><tr><td>Provisiones pendientes</td><td>'+money(f.provisions.filter(x=>!x.paid).reduce((a,x)=>a+num(x.amount),0))+'</td></tr></tbody></table></div></section><section class="panel"><h3>Accesos rápidos</h3><p class="desc">Registra el movimiento en el módulo correspondiente para evitar duplicaciones.</p><div class="actions"><button class="btn" onclick="go(\'cash\')">＋ Movimiento de caja</button><button class="btn" onclick="go(\'decants\')">＋ Botella para decants</button><button class="btn" onclick="go(\'supplies\')">＋ Material o equipo</button><button class="btn" onclick="go(\'expenses\')">＋ Gasto o provisión</button></div><div class="note">Importante: esta página no altera ventas, compras ni gastos históricos existentes. Para comenzar a usar la caja, registra el saldo inicial real una sola vez como aporte/saldo inicial.</div></section></div>'}
function allocBars(n){const distributable=Math.max(0,n),a=distributable*num(f.settings.reinvest)/100,b=distributable*num(f.settings.reserve)/100,c=distributable*num(f.settings.owner)/100;return '<div class="allocrow"><span>Reinversión <b>'+f.settings.reinvest+'%</b><div class="bar"><span style="width:'+f.settings.reinvest+'%;background:#bd7417"></span></div></span><strong>'+money(a)+'</strong></div><div class="allocrow"><span>Reserva <b>'+f.settings.reserve+'%</b><div class="bar"><span style="width:'+f.settings.reserve+'%;background:#64748b"></span></div></span><strong>'+money(b)+'</strong></div><div class="allocrow"><span>Retiro del dueño <b>'+f.settings.owner+'%</b><div class="bar"><span style="width:'+f.settings.owner+'%;background:#0f8b82"></span></div></span><strong>'+money(c)+'</strong></div>'}
function allocationPage(){const p=monthPnl(),prov=f.provisions.filter(x=>!x.paid).reduce((a,x)=>a+num(x.amount),0),tax=Number($('#taxProvision')?.value||0),manual=Number($('#otherProvision')?.value||0),base=Math.max(0,p.net-prov-tax-manual),r=f.settings.reinvest,sv=f.settings.reserve,ow=f.settings.owner;return pageHead('Utilidad distribuible','Primero cubre costos, gastos y obligaciones. Después aplica la regla 50/30/20.')+'<div class="cards">'+metric('Utilidad neta estimada',money(p.net),'Resultado del periodo')+metric('Provisiones pendientes',money(prov),'Obligaciones registradas')+metric('Utilidad distribuible',money(base),'Después de provisiones','green')+metric('Por distribuir',money(base),'Base de cálculo')+'</div><div class="grid2"><section class="panel"><h3>Provisiones adicionales para el cierre</h3><p class="desc">Impuestos u obligaciones estimadas que aún no has registrado en el módulo de provisiones. No las guarda hasta confirmar la distribución.</p><div class="field"><label>Impuestos por reservar (S/)</label><input id="taxProvision" type="number" min="0" step=".01" value="0" oninput="updateAllocPreview()"></div><div class="field"><label>Otras obligaciones pendientes (S/)</label><input id="otherProvision" type="number" min="0" step=".01" value="0" oninput="updateAllocPreview()"></div><div id="allocPreview">'+allocBars(base)+'</div><div class="note">No distribuyas utilidad si la caja real no alcanza para cubrir las obligaciones y el capital de trabajo. Una utilidad contable no siempre significa que ese dinero esté disponible en efectivo.</div></section><section class="panel"><h3>Política de distribución</h3><p class="desc">La suma debe ser 100%. Valores iniciales: 50% reinversión, 30% reserva y 20% retiro personal.</p><div class="row"><div class="field"><label>Reinversión (%)</label><input id="pctR" type="number" min="0" max="100" value="'+r+'"></div><div class="field"><label>Reserva (%)</label><input id="pctS" type="number" min="0" max="100" value="'+sv+'"></div></div><div class="field"><label>Retiro personal (%)</label><input id="pctO" type="number" min="0" max="100" value="'+ow+'"></div><button class="btn primary" onclick="savePolicy()">Guardar política</button><div id="policyMsg" class="footnote">Porcentajes actuales: '+(r+sv+ow)+'%.</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Confirmar distribución del periodo</h3><p class="desc">Guarda una fotografía del cálculo mensual. No crea dinero ni registra ventas.</p><div class="field"><label>Nota del cierre</label><input id="allocNote" placeholder="Ej. cierre octubre, solo tras revisar caja"></div><button class="btn dark" onclick="confirmAllocation('+base+')">Guardar distribución de '+esc(month)+'</button></section></div><section class="panel"><h3>Distribuciones guardadas</h3>'+table(f.allocations,['Fecha','Periodo','Base distribuible','Reinversión','Reserva','Retiro personal','Nota'],x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(x.month)+'</td><td>'+money(x.base)+'</td><td>'+money(x.reinvest)+'</td><td>'+money(x.reserve)+'</td><td>'+money(x.owner)+'</td><td>'+esc(x.note)+'</td></tr>')+'</section>'}
function updateAllocPreview(){const p=monthPnl(),prov=f.provisions.filter(x=>!x.paid).reduce((a,x)=>a+num(x.amount),0),base=Math.max(0,p.net-prov-num($('#taxProvision')?.value)-num($('#otherProvision')?.value));$('#allocPreview').innerHTML=allocBars(base)}
function savePolicy(){const r=num($('#pctR').value),s=num($('#pctS').value),o=num($('#pctO').value);if(r+s+o!==100){$('#policyMsg').textContent='La suma debe ser exactamente 100%. Actualmente suma '+(r+s+o)+'%.';return}f.settings={...f.settings,reinvest:r,reserve:s,owner:o};localStorage.setItem(FIN,JSON.stringify(f));toast('Política guardada.');render()}
function confirmAllocation(base){const r=num(f.settings.reinvest),s=num(f.settings.reserve),o=num(f.settings.owner);if(r+s+o!==100){toast('Corrige los porcentajes: deben sumar 100%.');return}const tax=num($('#taxProvision')?.value),other=num($('#otherProvision')?.value),prov=f.provisions.filter(x=>!x.paid).reduce((a,x)=>a+num(x.amount),0),finalBase=Math.max(0,monthPnl().net-prov-tax-other);if(f.allocations.some(x=>x.month===month)){if(!confirm('Ya existe una distribución guardada para este mes. ¿Guardar otra versión?'))return}f.allocations.push({id:uid(),date:today(),month,base:finalBase,reinvest:finalBase*r/100,reserve:finalBase*s/100,owner:finalBase*o/100,settings:{...f.settings},note:$('#allocNote')?.value||'',taxProvision:tax,otherProvision:other});f.cashMoves.push({id:uid(),date:today(),direction:'out',bucket:'operating',type:'distribution-calculation',amount:0,note:'Cálculo de utilidad guardado; no mueve efectivo automáticamente.'});save()}
function cashPage(){return pageHead('Caja y movimientos','Registra entradas y salidas reales de dinero. Las compras de inventario no son gastos duplicados en resultados.','<button class="btn primary" onclick="cashForm()">＋ Registrar movimiento</button>')+'<div class="cards">'+metric('Saldo de caja registrado',money(cashBalance()),'Solo movimientos añadidos a este módulo')+metric('Entradas',money(f.cashMoves.filter(x=>x.direction==='in').reduce((a,x)=>a+num(x.amount),0)),'Aportes, cobros y otros ingresos','green')+metric('Salidas',money(f.cashMoves.filter(x=>x.direction==='out').reduce((a,x)=>a+num(x.amount),0)),'Pagos y retiros','orange')+metric('Movimientos',f.cashMoves.length,'Historial trazable')+'</div><section class="panel"><h3>Nuevo movimiento</h3><p class="desc">Registra el efectivo real. Si una venta ya existe en la página principal, no la vuelvas a registrar como ingreso de venta aquí; registra solo el cobro que aún no figure en caja.</p><form onsubmit="addCash(event)"><div class="row"><div class="field"><label>Fecha</label><input type="date" name="date" value="'+today()+'" required></div><div class="field"><label>Tipo de movimiento</label><select name="direction"><option value="in">Entrada de dinero</option><option value="out">Salida de dinero</option></select></div></div><div class="row"><div class="field"><label>Categoría</label><select name="type"><option value="opening">Saldo inicial / capital disponible</option><option value="contribution">Aporte de socio</option><option value="sale-collection">Cobro de venta (solo si no se refleja en caja aún)</option><option value="purchase">Pago de compra / inventario</option><option value="expense">Pago de gasto</option><option value="reinvest">Reinversión / compra de activos</option><option value="reserve-transfer">Transferencia a reserva</option><option value="owner-withdrawal">Retiro personal</option><option value="loan">Préstamo recibido o pagado</option><option value="other">Otro</option></select></div><div class="field"><label>Destino / fondo</label><select name="bucket"><option value="operating">Caja operativa</option><option value="reserve">Reserva de la empresa</option><option value="reinvestment">Fondo de reinversión</option><option value="personal">Personal</option></select></div></div><div class="row"><div class="field"><label>Importe (S/)</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Medio</label><select name="method"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Tarjeta</option><option>Otro</option></select></div></div><div class="field"><label>Concepto / referencia</label><input name="note" placeholder="Qué pasó con este dinero" required></div><div class="formactions"><button class="btn primary">Guardar movimiento</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Historial de caja</h3>'+table(f.cashMoves.slice().sort((a,b)=>b.date.localeCompare(a.date)),['Fecha','Tipo','Fondo','Entrada','Salida','Medio','Concepto','Acción'],x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.bucket)+'</td><td class="green">'+(x.direction==='in'?money(x.amount):'—')+'</td><td class="orange">'+(x.direction==='out'?money(x.amount):'—')+'</td><td>'+esc(x.method||'—')+'</td><td>'+esc(x.note)+'</td><td><button class="btn small danger" onclick="del(\'cashMoves\',\''+x.id+'\')">Eliminar</button></td></tr>')+'</section>'}
function cashForm(){go('cash');}
function addCash(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));f.cashMoves.push({...d,id:uid(),amount:num(d.amount)});save()}
function decantsPage(){return pageHead('Decants y control de mililitros','Registra una botella madre de 100 ml y descuenta automáticamente el perfume utilizado al registrar ventas.','<button class="btn primary" onclick="go(\'decants\');document.getElementById(\'bottleForm\').scrollIntoView({behavior:\'smooth\'})">＋ Ingresar botella</button>')+'<div class="grid2"><section class="panel" id="bottleForm"><h3>Ingresar botella destinada a decants</h3><p class="desc">El costo total debe incluir la parte proporcional del flete del lote. Esta botella se administra en ml, separada de las botellas para venta completa.</p><form onsubmit="addBottle(event)"><div class="field"><label>Perfume / marca</label><input name="name" required placeholder="Ej. Hawas Malibu · Rasasi"></div><div class="row"><div class="field"><label>Fecha de compra</label><input type="date" name="date" value="'+today()+'" required></div><div class="field"><label>Contenido inicial (ml)</label><input type="number" name="mlInitial" min="1" step=".1" value="100" required></div></div><div class="row"><div class="field"><label>Costo de compra (S/)</label><input name="purchaseCost" type="number" min="0" step=".01" required></div><div class="field"><label>Flete/taxi asignado (S/)</label><input name="freight" type="number" min="0" step=".01" value="0" required></div></div><div class="field"><label>Nota / lote compartido</label><input name="note" placeholder="Ej. lote 16/10, flete compartido"></div><button class="btn primary">Registrar botella madre</button></form></section><section class="panel"><h3>Registrar venta de decants</h3><p class="desc">Elige una botella madre y presentación. Se descuentan ml y un envase del stock de materiales si lo registraste.</p><form onsubmit="addDecantSale(event)"><div class="field"><label>Botella madre</label><select name="bottleId" required>'+f.decantBottles.map(b=>'<option value="'+b.id+'">'+esc(b.name)+' · '+bottleRemaining(b).toFixed(1)+' ml</option>').join('')+'</select></div><div class="row"><div class="field"><label>Fecha</label><input type="date" name="date" value="'+today()+'" required></div><div class="field"><label>Presentación</label><select name="size"><option value="3">3 ml</option><option value="5">5 ml</option><option value="10" selected>10 ml</option></select></div></div><div class="row"><div class="field"><label>Cantidad</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="field"><label>Precio total cobrado (S/)</label><input name="total" type="number" min="0" step=".01" required></div></div><div class="field"><label>Material / envase a descontar</label><select name="materialId"><option value="">No descontar material</option>'+f.materials.filter(m=>m.kind==='consumable'&&num(m.stock)>0).map(m=>'<option value="'+m.id+'">'+esc(m.name)+' · stock '+m.stock+'</option>').join('')+'</select></div><div class="field"><label>Nota / cliente</label><input name="note" placeholder="Opcional"></div><button class="btn primary">Registrar venta y descontar ml</button></form></section></div><section class="panel"><h3>Botellas madre y mililitros disponibles</h3>'+table(f.decantBottles,['Fecha','Perfume','Ml inicial','Ml usados','Ml disponibles','Costo total','Costo por ml','Notas'],b=>'<tr><td>'+fmtDate(b.date)+'</td><td><strong>'+esc(b.name)+'</strong></td><td>'+num(b.mlInitial).toFixed(1)+'</td><td>'+num(b.mlUsed).toFixed(1)+'</td><td><strong>'+bottleRemaining(b).toFixed(1)+' ml</strong></td><td>'+money(b.costTotal)+'</td><td>'+money(costPerMl(b))+'</td><td>'+esc(b.note||'')+' <button class="btn small danger" onclick="del(\'decantBottles\',\''+b.id+'\')">Eliminar</button></td></tr>')+'</section><section class="panel" style="margin-top:16px"><h3>Ventas de decants</h3>'+table(f.decantSales.slice().sort((a,b)=>b.date.localeCompare(a.date)),['Fecha','Perfume','Presentación','Cantidad','Venta','Costo perfume','Materiales','Ganancia bruta','Nota','Acción'],s=>'<tr><td>'+fmtDate(s.date)+'</td><td>'+esc(s.bottleName)+'</td><td>'+s.size+' ml</td><td>'+s.qty+'</td><td>'+money(s.total)+'</td><td>'+money(s.perfumeCost)+'</td><td>'+money(s.materialCost)+'</td><td>'+money(num(s.total)-soldDecantCost(s))+'</td><td>'+esc(s.note||'')+'</td><td><button class="btn small danger" onclick="del(\'decantSales\',\''+s.id+'\')">Eliminar</button></td></tr>')+'</section>'}
function addBottle(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const total=num(d.purchaseCost)+num(d.freight);f.decantBottles.push({id:uid(),name:d.name,date:d.date,mlInitial:num(d.mlInitial),mlUsed:0,purchaseCost:num(d.purchaseCost),freight:num(d.freight),costTotal:total,note:d.note});save()}
function addDecantSale(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),b=f.decantBottles.find(x=>x.id===d.bottleId),size=num(d.size),qty=num(d.qty),ml=size*qty;if(!b){toast('Registra primero una botella madre.');return}if(ml>bottleRemaining(b)){toast('No hay suficientes mililitros disponibles.');return}const mat=f.materials.find(x=>x.id===d.materialId);if(mat&&num(mat.stock)<qty){toast('No hay suficientes unidades del material seleccionado.');return}const perfumeCost=ml*costPerMl(b),materialCost=mat?num(mat.unitCost)*qty:0;b.mlUsed=num(b.mlUsed)+ml;if(mat)mat.stock=num(mat.stock)-qty;f.decantSales.push({id:uid(),date:d.date,bottleId:b.id,bottleName:b.name,size,qty,ml,total:num(d.total),perfumeCost,materialCost,packagingCost:0,note:d.note||'',materialId:d.materialId||''});save()}
function suppliesPage(){return pageHead('Materiales y equipos','Controla stock, costo unitario y reposición. Equipos duraderos se separan de consumibles.','<button class="btn primary" onclick="document.getElementById(\'materialForm\').scrollIntoView({behavior:\'smooth\'})">＋ Registrar material</button>')+'<div class="grid2"><section class="panel" id="materialForm"><h3>Registrar compra de material o equipo</h3><p class="desc">Ejemplos: atomizadores 3/5/10 ml, etiquetas Niimbot 1.4×4 cm, bolsas burbuja 11×15 cm, goteros, adaptadores e impresora D11 Plus.</p><form onsubmit="addMaterial(event)"><div class="field"><label>Nombre del insumo/equipo</label><input name="name" required placeholder="Ej. Atomizador 10 ml"></div><div class="row"><div class="field"><label>Tipo</label><select name="kind"><option value="consumable">Consumible / material</option><option value="equipment">Equipo / herramienta</option></select></div><div class="field"><label>Fecha de compra</label><input name="date" type="date" value="'+today()+'" required></div></div><div class="row"><div class="field"><label>Cantidad comprada</label><input name="qty" type="number" min=".01" step=".01" required></div><div class="field"><label>Unidad</label><input name="unit" placeholder="unidades, rollos, paquetes" value="unidades" required></div></div><div class="row"><div class="field"><label>Costo total pagado (S/)</label><input name="total" type="number" min="0" step=".01" required></div><div class="field"><label>Stock mínimo (opcional)</label><input name="minStock" type="number" min="0" step=".01" value="0"></div></div><div class="field"><label>Notas</label><input name="note" placeholder="Proveedor, comprobante o lote"></div><button class="btn primary">Guardar compra</button></form></section><section class="panel"><h3>Resumen de materiales</h3><p class="desc">Stock valorizado a costo de compra registrado.</p>'+metric('Materiales y equipos',f.materials.length,'Registros')+metric('Valor registrado',money(f.materials.reduce((a,m)=>a+num(m.unitCost)*num(m.qty),0)),'Valor original, no necesariamente valor contable neto')+'</section></div><section class="panel"><h3>Inventario de materiales y equipos</h3>'+table(f.materials,['Nombre','Tipo','Fecha','Stock','Unidad','Costo unitario','Valor original','Mínimo','Estado','Notas','Acción'],m=>'<tr><td><strong>'+esc(m.name)+'</strong></td><td>'+esc(m.kind==='equipment'?'Equipo':'Consumible')+'</td><td>'+fmtDate(m.date)+'</td><td>'+num(m.stock).toFixed(2)+'</td><td>'+esc(m.unit)+'</td><td>'+money(m.unitCost)+'</td><td>'+money(num(m.qty)*num(m.unitCost))+'</td><td>'+num(m.minStock)+'</td><td>'+(num(m.stock)<=num(m.minStock)?'<span class="pill orange">Reponer</span>':'<span class="pill green">En stock</span>')+'</td><td>'+esc(m.note||'')+'</td><td><button class="btn small danger" onclick="del(\'materials\',\''+m.id+'\')">Eliminar</button></td></tr>')+'</section>'}
function addMaterial(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),qty=num(d.qty),total=num(d.total);f.materials.push({id:uid(),name:d.name,kind:d.kind,date:d.date,qty,stock:qty,unit:d.unit,unitCost:total/(qty||1),total,minStock:num(d.minStock),note:d.note||''});save()}
function expensesPage(){return pageHead('Gastos y provisiones','Registra gastos que afectan el resultado y obligaciones que debes reservar antes de distribuir utilidad.','<button class="btn primary" onclick="document.getElementById(\'expenseForm\').scrollIntoView({behavior:\'smooth\'})">＋ Registrar</button>')+'<div class="grid2"><section class="panel" id="expenseForm"><h3>Registrar gasto operativo</h3><form onsubmit="addExpense(event)"><div class="row"><div class="field"><label>Fecha</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>Línea</label><select name="line"><option value="shared">Compartido</option><option value="perfumes">Perfumes completos</option><option value="decants">Decants</option></select></div></div><div class="row"><div class="field"><label>Categoría</label><select name="category"><option>Flete de compra</option><option>Taxi / transporte a almacén</option><option>Publicidad</option><option>Materiales decants</option><option>Comisiones de pago</option><option>Servicios</option><option>Impuestos</option><option>Otro</option></select></div><div class="field"><label>Importe (S/)</label><input name="amount" type="number" min=".01" step=".01" required></div></div><div class="field"><label>Descripción / comprobante</label><input name="note" required placeholder="Concepto y referencia"></div><button class="btn primary">Guardar gasto</button></form></section><section class="panel"><h3>Registrar obligación / provisión</h3><p class="desc">Una provisión aparta utilidad para un pago pendiente. Cuando se paga, marca la obligación como pagada y registra la salida real en caja.</p><form onsubmit="addProvision(event)"><div class="field"><label>Concepto</label><input name="name" required placeholder="Ej. Impuesto estimado, proveedor pendiente"></div><div class="row"><div class="field"><label>Vencimiento</label><input name="dueDate" type="date" value="'+today()+'"></div><div class="field"><label>Importe estimado (S/)</label><input name="amount" type="number" min=".01" step=".01" required></div></div><button class="btn primary">Guardar provisión</button></form></section></div><div class="grid2"><section class="panel"><h3>Gastos registrados</h3>'+table(f.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)),['Fecha','Línea','Categoría','Importe','Detalle','Acción'],x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+esc(x.line)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.note)+'</td><td><button class="btn small danger" onclick="del(\'expenses\',\''+x.id+'\')">Eliminar</button></td></tr>')+'</section><section class="panel"><h3>Provisiones</h3>'+table(f.provisions,['Concepto','Vence','Importe','Estado','Acción'],x=>'<tr><td>'+esc(x.name)+'</td><td>'+fmtDate(x.dueDate)+'</td><td>'+money(x.amount)+'</td><td>'+(x.paid?'<span class="pill green">Pagada</span>':'<span class="pill orange">Pendiente</span>')+'</td><td><div class="actions"><button class="btn small" onclick="toggleProvision(\''+x.id+'\')">'+(x.paid?'Marcar pendiente':'Marcar pagada')+'</button><button class="btn small danger" onclick="del(\'provisions\',\''+x.id+'\')">Eliminar</button></div></td></tr>')+'</section></div>'}
function addExpense(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));f.expenses.push({...d,id:uid(),amount:num(d.amount)});save()}
function addProvision(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));f.provisions.push({...d,id:uid(),amount:num(d.amount),paid:false});save()}
function toggleProvision(id){const p=f.provisions.find(x=>x.id===id);if(p)p.paid=!p.paid;save()}
function reportsPage(){const months=[...new Set([...existing().sales.map(s=>(s.date||'').slice(0,7)),...f.decantSales.map(s=>(s.date||'').slice(0,7)),...f.expenses.map(s=>(s.date||'').slice(0,7))].filter(Boolean))].sort().reverse();return pageHead('Informes','Consulta cierres, movimientos, stock y exporta tus datos para análisis.')+'<div class="grid2"><section class="panel"><h3>Resumen por mes</h3><p class="desc">Selecciona un mes desde el dashboard para cambiar el periodo. Exporta un CSV para analizarlo en Excel.</p>'+table(months,['Periodo','Ventas perfumes','Ventas decants','Gastos adicionales','Utilidad neta estimada','Acción'],m=>{const prev=month;month=m;const p=monthPnl();month=prev;return '<tr><td>'+m+'</td><td>'+money(p.existingRevenue)+'</td><td>'+money(p.decRevenue)+'</td><td>'+money(p.newExp)+'</td><td>'+money(p.net)+'</td><td><button class="btn small" onclick="exportMonth(\''+m+'\')">CSV</button></td></tr>'})+'</section><section class="panel"><h3>Respaldo de datos</h3><p class="desc">Descarga una copia JSON de este módulo y del sistema principal. Guarda el archivo en un lugar seguro.</p><button class="btn primary" onclick="downloadBackup()">Descargar respaldo completo</button><p class="footnote">Los datos se guardan en este navegador. Para compartirlos entre dispositivos necesitas sincronización con Firebase o intercambiar respaldos.</p><div class="note">No uses la importación/exportación como sustituto de una conciliación contable. Revisa que los saldos de caja coincidan con efectivo, bancos, Yape y Plin reales.</div></section></div>'}
function table(rows,heads,renderRow){if(!rows.length)return '<div class="empty">Todavía no hay registros en esta sección.</div>';return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(renderRow).join('')+'</tbody></table></div>'}
function del(key,id){if(!confirm('¿Eliminar este registro? Esta acción puede afectar los cálculos.'))return;if(key==='decantSales'){const s=f.decantSales.find(x=>x.id===id);if(s){const b=f.decantBottles.find(x=>x.id===s.bottleId);if(b)b.mlUsed=Math.max(0,num(b.mlUsed)-num(s.size)*num(s.qty));const m=f.materials.find(x=>x.id===s.materialId);if(m)m.stock=num(m.stock)+num(s.qty)}}f[key]=f[key].filter(x=>x.id!==id);save()}
function go(p){page=p;render()}
function setMonth(v){if(v)month=v;render()}
function render(){const titles={overview:'Resumen general',allocation:'Utilidad distribuible',cash:'Caja y movimientos',decants:'Decants y ml',supplies:'Materiales y equipos',expenses:'Gastos y provisiones',reports:'Informes'};$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='overview')shell(titles[page],overview());if(page==='allocation')shell(titles[page],allocationPage());if(page==='cash')shell(titles[page],cashPage());if(page==='decants')shell(titles[page],decantsPage());if(page==='supplies')shell(titles[page],suppliesPage());if(page==='expenses')shell(titles[page],expensesPage());if(page==='reports')shell(titles[page],reportsPage())}
function downloadBackup(){const data={finance:f,main:loadMain()},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TRENDIA-respaldo-'+today()+'.json';a.click();URL.revokeObjectURL(url)}
function exportMonth(m){const prev=month;month=m;const p=monthPnl();month=prev;const rows=[['Periodo','Ventas perfumes','Costo perfumes','Ventas decants','Costo decants','Gastos principales','Gastos finanzas','Utilidad neta'],[m,p.existingRevenue,p.existingCost,p.decRevenue,p.decCost,p.oldExp,p.newExp,p.net]];const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='TRENDIA-informe-'+m+'.csv';a.click();URL.revokeObjectURL(u)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});$('#today').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});render();
</script></body></html>
